[project]
authors = [
  { name = "Adrien Plaçais", email = "placais@lpsc.in2p3.fr" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.10.7,<4",
  "numpy>=2.3.3,<3",
  "pandas>=2.3.3,<3",
  "pre-commit>=4, <5",
  "PyQt5>=5.15.10,< 6",
  "scipy>=1.14,<2",
]
description = "Fit various Electron EMIssion models on experimental data."
dynamic = ["version"]
keywords = ["electron emission", "multipactor"]
name = "EEmiLib"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
docs = [
  "linkify-it-py>=2,<3",
  "myst-parser>=4,<5",
  "sphinx-autodoc-typehints>=3.5,<4",
  "sphinx-gallery>=0.21,<1",
  "sphinx-qt-documentation>=0.4,<1",
  "sphinx-rtd-theme>=3,<4",
  "sphinx>=8.2,<9",
  "sphinxcontrib-bibtex>=2.6,<3",
]
test = ["pytest>=8.3.2,<9", "sphinx-gallery>=0.21,<1"]

[project.scripts]
eemilib-gui = "eemilib.gui.gui:main"

[project.urls]
Documentation = "https://adrienplacais.github.io/EEmiLib/"
Homepage = "https://github.com/AdrienPlacais/EEmiLib"

[tool.ruff]
line-length = 79

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
  "UP", # pyupgrade
  "D",  # pydocstyle
]
ignore = [
  "LOG015", # TODO: fix LOG015 (use own logger)
  "BLE001", # Do not catch blind exception: `Exception`
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.per-file-ignores]
"examples/**" = ["D"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
filterwarnings = ["ignore:.*cKDTree.*:DeprecationWarning"]
markers = [
  "implementation: mark tests/functionalities currently under implementation",
  "example: example scripts",
  "slow: mark a test as slow (deselect with '-m \"not slow\"')",
  "smoke: mark quick and critical tests (select with '-m smoke')",
]
minversion = "6.0"
testpaths = ["tests"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.setuptools_scm]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "wheel", "setuptools-scm>=8, <9"]
